<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inuyasha 2D</title>
<style>
  :root {
    --bg: #14101c;
    --panel: #221a30;
    --ink: #f4ead8;
    --muted: #a89bb8;
    --accent: #e0483c;
    --accent-2: #f2b84b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu {
    flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 16px;
    background: radial-gradient(ellipse at 50% 20%, #3a2350 0%, var(--bg) 70%);
  }
  #menu h1 {
    margin: 0; font-size: clamp(2.2rem, 8vw, 4.5rem); letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); text-shadow: 0 4px 0 var(--accent), 0 0 30px rgba(224,72,60,.5);
  }
  #menu p.sub { margin: -14px 0 0; color: var(--muted); font-size: clamp(.9rem, 2.5vw, 1.1rem); }
  .choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
  .choice {
    flex: 1 1 240px; padding: 22px 18px; border-radius: 14px; border: 2px solid #3d2f52; background: var(--panel);
    color: var(--ink); cursor: pointer; text-align: center; font: inherit; position: relative;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-3px); border-color: var(--accent-2); outline: none; background: #2c2140; }
  .choice .ico { font-size: 2.6rem; display: block; margin-bottom: 6px; }
  .choice .name { font-size: 1.35rem; font-weight: 700; display: block; }
  .choice .desc { color: var(--muted); font-size: .9rem; margin-top: 4px; display: block; }
  .choice .badge {
    position: absolute; top: -10px; right: 12px; background: var(--accent-2); color: #2a1a00;
    font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; display: none;
  }
  .choice.recommended .badge { display: block; }
  .version { color: var(--muted); font-size: .8rem; position: absolute; bottom: 10px; }

  /* ---------- Game ---------- */
  #game { align-items: center; justify-content: center; background: #000; }
  #stage { position: relative; }
  canvas { display: block; background: #1b1530; image-rendering: pixelated; }
  #hud {
    position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between;
    align-items: flex-start; pointer-events: none; font-weight: 700; text-shadow: 0 2px 0 #000;
  }
  .bar { width: 180px; height: 14px; border: 2px solid #000; background: #3a1414; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff6a5c, #c9281c); transition: width .15s; }
  #btnMenu {
    position: absolute; top: 34px; right: 10px; padding: 6px 12px; border-radius: 8px; border: 0;
    background: rgba(0,0,0,.55); color: var(--ink); font: inherit; font-size: .85rem; cursor: pointer;
  }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(10,6,16,.78); text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 2.2rem; color: var(--accent-2); }
  #overlay button, .btn {
    padding: 12px 26px; border-radius: 10px; border: 0; background: var(--accent); color: #fff;
    font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  }

  /* Controles tactiles (solo modo Android) */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.android #touch { display: block; }
  .tbtn {
    position: absolute; bottom: 18px; width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.4); color: #fff;
    font-size: 1.6rem; display: flex; align-items: center; justify-content: center; pointer-events: auto;
    backdrop-filter: blur(2px);
  }
  .tbtn.on { background: rgba(255,255,255,.4); }
  #tLeft { left: 18px; } #tRight { left: 106px; }
  #tJump { right: 18px; } #tAtk { right: 106px; background: rgba(224,72,60,.3); }
</style>
</head>
<body>

<div id="menu" class="screen active">
  <h1>Inuyasha 2D</h1>
  <p class="sub">Elige tu versión para jugar</p>
  <div class="choices">
    <button class="choice" id="chPC" data-mode="pc">
      <span class="badge">Recomendado</span>
      <span class="ico">🖥️</span>
      <span class="name">Versión PC</span>
      <span class="desc">Teclado: flechas / A D, Espacio para saltar, X o J para atacar</span>
    </button>
    <button class="choice" id="chAndroid" data-mode="android">
      <span class="badge">Recomendado</span>
      <span class="ico">📱</span>
      <span class="name">Versión Android</span>
      <span class="desc">Pantalla táctil con botones en pantalla</span>
    </button>
  </div>
  <span class="version">v0.1 · prototipo</span>
</div>

<div id="game" class="screen">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="hud">
      <div><div class="bar"><i id="hp"></i></div></div>
      <div id="score">Demonios: 0</div>
    </div>
    <button id="btnMenu">☰ Menú</button>
    <div id="touch">
      <div class="tbtn" id="tLeft">◀</div>
      <div class="tbtn" id="tRight">▶</div>
      <div class="tbtn" id="tAtk">⚔</div>
      <div class="tbtn" id="tJump">▲</div>
    </div>
    <div id="overlay">
      <h2 id="ovTitle">Has caído</h2>
      <div id="ovText"></div>
      <button id="ovBtn">Reintentar</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const W = 960, H = 540, GROUND = 450;
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  let mode = "pc";

  // ---------- Menu ----------
  const isTouchDevice = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && innerWidth < 900);
  $(isTouchDevice ? "chAndroid" : "chPC").classList.add("recommended");

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  }
  function startGame(m) {
    mode = m;
    document.body.classList.toggle("android", m === "android");
    show("game");
    fit();
    reset();
    if (m === "android") {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
    }
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }
  function toMenu() {
    running = false;
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    show("menu");
  }
  document.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => startGame(b.dataset.mode)));
  $("btnMenu").addEventListener("click", toMenu);
  $("ovBtn").addEventListener("click", () => { reset(); });

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * s + "px";
    cv.style.height = H * s + "px";
    $("stage").style.width = W * s + "px";
    $("stage").style.height = H * s + "px";
  }
  addEventListener("resize", fit);

  // ---------- Input ----------
  const keys = { left: false, right: false, jump: false, atk: false };
  const map = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
                ArrowUp: "jump", KeyW: "jump", Space: "jump", KeyX: "atk", KeyJ: "atk" };
  addEventListener("keydown", (e) => { if (map[e.code]) { keys[map[e.code]] = true; e.preventDefault(); } });
  addEventListener("keyup", (e) => { if (map[e.code]) { keys[map[e.code]] = false; e.preventDefault(); } });
  function bindTouch(id, k) {
    const el = $(id);
    const on = (e) => { keys[k] = true; el.classList.add("on"); e.preventDefault(); };
    const off = (e) => { keys[k] = false; el.classList.remove("on"); e.preventDefault(); };
    el.addEventListener("pointerdown", on);
    ["pointerup", "pointercancel", "pointerleave"].forEach((t) => el.addEventListener(t, off));
  }
  bindTouch("tLeft", "left"); bindTouch("tRight", "right"); bindTouch("tJump", "jump"); bindTouch("tAtk", "atk");

  // ---------- Game state ----------
  let running = false, last = 0, p, enemies, slashes, particles, kills, spawnT, dead, t;

  function reset() {
    p = { x: 200, y: GROUND, vx: 0, vy: 0, face: 1, hp: 100, atkT: 0, atkCd: 0, inv: 0, onGround: true };
    enemies = []; slashes = []; particles = []; kills = 0; spawnT = 1; dead = false; t = 0;
    $("overlay").classList.remove("show");
    updateHud();
  }
  function updateHud() {
    $("hp").style.width = Math.max(0, p.hp) + "%";
    $("score").textContent = "Demonios: " + kills;
  }
  function spawn() {
    const fromLeft = Math.random() < 0.5;
    const flying = Math.random() < 0.3;
    enemies.push({
      x: fromLeft ? -40 : W + 40, y: flying ? GROUND - 110 - Math.random() * 60 : GROUND,
      vx: (fromLeft ? 1 : -1) * (70 + Math.random() * 60 + Math.min(kills * 2, 80)),
      hp: 1, flying, bob: Math.random() * 6,
    });
  }
  function burst(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5, color });
    }
  }

  function update(dt) {
    t += dt;
    if (dead) return;
    // Movimiento
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    p.vx = dir * 260;
    if (dir) p.face = dir;
    if (keys.jump && p.onGround) { p.vy = -620; p.onGround = false; }
    p.vy += 1700 * dt;
    p.x = Math.max(20, Math.min(W - 20, p.x + p.vx * dt));
    p.y += p.vy * dt;
    if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; }
    // Ataque (Tessaiga)
    p.atkCd -= dt; p.atkT -= dt; p.inv -= dt;
    if (keys.atk && p.atkCd <= 0) {
      p.atkCd = 0.38; p.atkT = 0.16;
      slashes.push({ x: p.x + p.face * 46, y: p.y - 40, face: p.face, life: 0.16 });
    }
    // Enemigos
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.55, 1.6 - kills * 0.03) * (0.7 + Math.random() * 0.6); }
    for (const e of enemies) {
      e.x += e.vx * dt;
      if (e.flying) e.y += Math.sin(t * 4 + e.bob) * 40 * dt;
      for (const s of slashes) {
        if (Math.abs(e.x - s.x) < 70 && Math.abs((e.y - 30) - s.y) < 60) e.hp = 0;
      }
      if (e.hp > 0 && p.inv <= 0 && Math.abs(e.x - p.x) < 34 && Math.abs(e.y - p.y) < 56) {
        p.hp -= 15; p.inv = 0.8; p.vy = -300; p.onGround = false;
        p.x += (p.x < e.x ? -1 : 1) * 40;
        burst(p.x, p.y - 40, "#ff6a5c");
      }
    }
    for (const e of enemies) if (e.hp <= 0) { kills++; burst(e.x, e.y - 30, "#b06cff"); }
    enemies = enemies.filter((e) => e.hp > 0 && e.x > -80 && e.x < W + 80);
    slashes.forEach((s) => (s.life -= dt)); slashes = slashes.filter((s) => s.life > 0);
    particles.forEach((q) => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.life -= dt; });
    particles = particles.filter((q) => q.life > 0);
    if (p.hp <= 0) {
      dead = true;
      $("ovTitle").textContent = "Has caído";
      $("ovText").textContent = "Demonios derrotados: " + kills;
      $("overlay").classList.add("show");
    }
    updateHud();
  }

  // ---------- Render ----------
  function drawBG() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#2a1740"); g.addColorStop(0.6, "#7a3a55"); g.addColorStop(1, "#e08a5a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f7e3b0"; ctx.beginPath(); ctx.arc(760, 130, 54, 0, 7); ctx.fill();
    ctx.fillStyle = "#3a2350";
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 60) ctx.lineTo(x, GROUND - 120 - 50 * Math.sin(x * 0.011 + 1));
    ctx.lineTo(W, GROUND); ctx.fill();
    ctx.fillStyle = "#1c1228"; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = "#2f7a3a"; ctx.fillRect(0, GROUND, W, 8);
  }
  function drawPlayer() {
    if (p.inv > 0 && Math.floor(p.inv * 20) % 2) return;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.face, 1);
    ctx.fillStyle = "#c9281c"; ctx.fillRect(-16, -62, 32, 48);        // haori rojo
    ctx.fillStyle = "#f0d4b0"; ctx.fillRect(-11, -84, 22, 22);        // cara
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(-16, -90, 32, 12);        // cabello plateado
    ctx.fillRect(-20, -84, 8, 56);
    ctx.fillStyle = "#c9a26a"; ctx.fillRect(-4, -96, 6, 8); ctx.fillRect(6, -96, 6, 8); // orejas
    ctx.fillStyle = "#222"; ctx.fillRect(4, -76, 4, 4);               // ojo
    ctx.fillStyle = "#5a2a6a"; ctx.fillRect(-14, -14, 12, 14); ctx.fillRect(2, -14, 12, 14); // piernas
    // Tessaiga
    ctx.save(); ctx.translate(14, -46); ctx.rotate(p.atkT > 0 ? 0.9 - (0.16 - p.atkT) * 12 : -0.6);
    ctx.fillStyle = "#d9d9e6"; ctx.fillRect(0, -6, 52, 6);
    ctx.fillStyle = "#6a3a1a"; ctx.fillRect(-8, -7, 8, 8);
    ctx.restore(); ctx.restore();
  }
  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.scale(e.vx > 0 ? 1 : -1, 1);
    ctx.fillStyle = e.flying ? "#3d6b3a" : "#5b2f6e";
    ctx.beginPath(); ctx.ellipse(0, -28, 24, 26, 0, 0, 7); ctx.fill();
    if (e.flying) { ctx.fillStyle = "#294a27"; ctx.fillRect(-40, -46, 24, 6); ctx.fillRect(16, -46, 24, 6); }
    ctx.fillStyle = "#ffdd55"; ctx.fillRect(6, -36, 8, 6);
    ctx.restore();
  }
  function render() {
    drawBG();
    enemies.forEach(drawEnemy);
    drawPlayer();
    for (const s of slashes) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.scale(s.face, 1);
      ctx.strokeStyle = "rgba(255,255,255," + s.life / 0.16 + ")"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(-20, 0, 50, -0.9, 0.9); ctx.stroke(); ctx.restore();
    }
    for (const q of particles) { ctx.fillStyle = q.color; ctx.globalAlpha = q.life * 2; ctx.fillRect(q.x, q.y, 5, 5); }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  // Ganchos para pruebas automáticas (Playwright)
  window.__game = { get state() { return { mode, kills, hp: p && p.hp, enemies: enemies && enemies.length, running }; } };
})();
</script>
</body>
</html>
